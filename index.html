<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Marvel Survivors</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a15;font-family:'Segoe UI',Arial,sans-serif;color:#fff;touch-action:none}
  #game{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%;background:#1a1a2e}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:15px;z-index:10;background:radial-gradient(circle at center,#1a1a3e 0%,#0a0a15 100%)}
  .hidden{display:none!important}
  h1{font-size:clamp(28px,6vw,56px);background:linear-gradient(90deg,#e52529,#f7d02e,#5182ed);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:2px;text-align:center;text-shadow:0 0 40px rgba(229,37,41,.5)}
  h2{font-size:clamp(18px,4vw,28px);color:#f7d02e}
  .btn{padding:14px 28px;font-size:18px;font-weight:700;background:linear-gradient(135deg,#e52529,#a01015);color:#fff;border:2px solid #f7d02e;border-radius:10px;cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:200px;text-transform:uppercase;letter-spacing:1px}
  .btn:hover,.btn:active{transform:translateY(-2px);box-shadow:0 5px 20px rgba(229,37,41,.6)}
  .btn.alt{background:linear-gradient(135deg,#5182ed,#1f4ea8)}
  input{padding:12px 18px;font-size:16px;border:2px solid #f7d02e;border-radius:8px;background:#0a0a15;color:#fff;min-width:240px;text-align:center}
  .heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:720px;width:100%;margin-top:10px}
  .hero-card{padding:14px;border:2px solid #444;border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;text-align:center;transition:all .15s}
  .hero-card:hover{transform:translateY(-3px);border-color:#f7d02e}
  .hero-card.selected{border-color:#f7d02e;background:rgba(247,208,46,.12);box-shadow:0 0 20px rgba(247,208,46,.3)}
  .hero-icon{width:60px;height:60px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
  .hero-name{font-weight:700;font-size:14px;margin-bottom:4px}
  .hero-desc{font-size:11px;color:#aaa;line-height:1.3}
  .hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;font-size:14px}
  .hud-left,.hud-right{background:rgba(0,0,0,.6);padding:10px 14px;border-radius:8px;border:1px solid #444;backdrop-filter:blur(4px)}
  .hpbar{width:200px;height:14px;background:#2a0a0a;border:2px solid #e52529;border-radius:7px;overflow:hidden;margin-top:4px}
  .hpbar>div{height:100%;background:linear-gradient(90deg,#e52529,#ff6666);transition:width .2s}
  .xpbar{width:200px;height:8px;background:#0a2a0a;border:1px solid #5182ed;border-radius:4px;overflow:hidden;margin-top:4px}
  .xpbar>div{height:100%;background:linear-gradient(90deg,#5182ed,#7aaeff);transition:width .2s}
  .upgrade-panel{background:rgba(10,10,20,.95);border:2px solid #f7d02e;border-radius:12px;padding:20px;max-width:520px;width:90%;box-shadow:0 0 40px rgba(247,208,46,.3)}
  .upgrade-option{padding:14px;margin:8px 0;background:rgba(255,255,255,.05);border:2px solid #555;border-radius:8px;cursor:pointer;transition:all .15s}
  .upgrade-option:hover{background:rgba(247,208,46,.15);border-color:#f7d02e;transform:translateX(5px)}
  .upgrade-name{font-weight:700;color:#f7d02e;margin-bottom:4px;font-size:16px}
  .upgrade-desc{font-size:13px;color:#ccc}
  .upgrade-rarity{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
  .rarity-common{background:#555;color:#fff}
  .rarity-rare{background:#5182ed;color:#fff}
  .rarity-epic{background:#a020f0;color:#fff}
  .rarity-legendary{background:#f7d02e;color:#000}
  .joystick{position:absolute;bottom:40px;left:40px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none;touch-action:none;z-index:4}
  .joystick-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(247,208,46,.6);border:2px solid #f7d02e;pointer-events:none}
  @media(hover:none)and(pointer:coarse){.joystick{display:block}}
  .leaderboard-list{max-height:340px;overflow-y:auto;width:90%;max-width:520px;background:rgba(0,0,0,.4);border:1px solid #555;border-radius:8px;padding:10px}
  .lb-row{display:grid;grid-template-columns:40px 1fr 80px 80px;padding:8px 12px;border-bottom:1px solid #333;font-size:14px}
  .lb-row.head{font-weight:700;color:#f7d02e;border-bottom:2px solid #f7d02e}
  .toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(247,208,46,.95);color:#000;padding:16px 32px;border-radius:10px;font-weight:900;font-size:28px;pointer-events:none;animation:pop 1.2s forwards;z-index:20;box-shadow:0 0 30px rgba(247,208,46,.8)}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}40%{transform:translate(-50%,0) scale(1)}90%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(.8)}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:15px}
  .stats span{color:#f7d02e;font-weight:700}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- MAIN MENU -->
  <div id="menuScreen" class="screen">
    <h1>MARVEL<br>SURVIVORS</h1>
    <input id="nameInput" type="text" placeholder="ENTER HERO NAME" maxlength="14" />
    <button class="btn" onclick="goToHeroSelect()">START RUN</button>
    <button class="btn alt" onclick="showLeaderboard()">🏆 LEADERBOARD</button>
    <div style="font-size:12px;color:#888;margin-top:10px">WASD/Arrows to move · Mobile: use joystick · Auto-attack</div>
  </div>

  <!-- HERO SELECT -->
  <div id="heroScreen" class="screen hidden">
    <h2>CHOOSE YOUR HERO</h2>
    <div id="heroList" class="heroes"></div>
    <button class="btn" onclick="startGame()">BEGIN MISSION</button>
    <button class="btn alt" onclick="showScreen('menuScreen')">Back</button>
  </div>

  <!-- HUD -->
  <div class="hud hidden" id="hud">
    <div class="hud-left">
      <div>❤️ <span id="hpText">100/100</span></div>
      <div class="hpbar"><div id="hpFill" style="width:100%"></div></div>
      <div style="margin-top:6px">⭐ LVL <span id="lvlText">1</span></div>
      <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
    </div>
    <div class="hud-right">
      <div>⏱️ <span id="timeText">0:00</span></div>
      <div>💀 <span id="killText">0</span></div>
      <div>🦸 <span id="heroText">-</span></div>
    </div>
  </div>

  <div class="joystick" id="joystick">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <!-- LEVEL UP -->
  <div id="upgradeScreen" class="screen hidden" style="background:rgba(0,0,0,.7)">
    <div class="upgrade-panel">
      <h2 style="text-align:center;margin-bottom:12px">⬆️ LEVEL UP!</h2>
      <div id="upgradeList"></div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen" class="screen hidden">
    <h1 style="color:#e52529;-webkit-text-fill-color:#e52529">MISSION FAILED</h1>
    <div class="stats">
      <div>Time: <span id="finalTime">0:00</span></div>
      <div>Kills: <span id="finalKills">0</span></div>
      <div>Level: <span id="finalLevel">1</span></div>
      <div>Score: <span id="finalScore">0</span></div>
    </div>
    <button class="btn" onclick="goToHeroSelect()">PLAY AGAIN</button>
    <button class="btn alt" onclick="showScreen('menuScreen')">MAIN MENU</button>
  </div>

  <!-- LEADERBOARD -->
  <div id="leaderboardScreen" class="screen hidden">
    <h1 style="font-size:36px">🏆 TOP HEROES</h1>
    <div id="lbList" class="leaderboard-list">
      <div class="lb-row head"><div>#</div><div>Hero</div><div>Score</div><div>Time</div></div>
    </div>
    <button class="btn" onclick="showScreen('menuScreen')">BACK</button>
  </div>
</div>

<script>
// ============ SUPABASE ============
const SUPABASE_URL = "https://lnztwceiuzqxazatdten.supabase.co";
const SUPABASE_KEY = "sb_publishable_XX4svimjCN05aZ64giuy0g_R4ES5GUU";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// ============ HEROES ============
const HEROES = {
  spiderman: {
    name: "Spider-Man", icon: "🕷️", color: "#e52529", accent:"#1f4ea8",
    desc: "Fast web shooters. Spider-Sense dodges attacks.",
    weapon: "web", speedMul: 1.0, hpMul: 0.9, dmgMul: 1.0, special: "dodge"
  },
  ironman: {
    name: "Iron Man", icon: "⚡", color: "#d4af37", accent:"#a01015",
    desc: "Piercing repulsor rays. Flight gives speed.",
    weapon: "repulsor", speedMul: 1.15, hpMul: 1.0, dmgMul: 1.1, special: "flight"
  },
  thor: {
    name: "Thor", icon: "⚡", color: "#5182ed", accent:"#999",
    desc: "Mjolnir boomerang. Lightning aura damages nearby.",
    weapon: "mjolnir", speedMul: 0.95, hpMul: 1.2, dmgMul: 1.3, special: "aura"
  },
  captain: {
    name: "Captain A.", icon: "★", color: "#1f4ea8", accent:"#e52529",
    desc: "Bouncing shield. Tactical genius slows spawns.",
    weapon: "shield", speedMul: 1.0, hpMul: 1.2, dmgMul: 1.0, special: "slowspawn"
  },
  strange: {
    name: "Dr. Strange", icon: "✦", color: "#a020f0", accent:"#f7d02e",
    desc: "Homing mystic bolts. Portal dodges danger.",
    weapon: "mystic", speedMul: 1.0, hpMul: 0.95, dmgMul: 1.15, special: "portal"
  },
  wanda: {
    name: "Scarlet W.", icon: "✸", color: "#e52529", accent:"#a020f0",
    desc: "Chaos magic AoE. Reality warp slows foes.",
    weapon: "chaos", speedMul: 1.0, hpMul: 1.0, dmgMul: 1.2, special: "slowall"
  }
};

// ============ ENEMIES ============
const ENEMIES = [
  { id:"hydra",   name:"Hydra Soldier",  color:"#4a6b3a", size:14, hp:20,  speed:55,  dmg:8,  xp:1, score:10 },
  { id:"chitauri",name:"Chitauri",       color:"#6a4a8a", size:12, hp:15,  speed:90,  dmg:6,  xp:1, score:8 },
  { id:"doombot", name:"Doombot",        color:"#555566", size:16, hp:35,  speed:65,  dmg:10, xp:2, score:18, shoots:true },
  { id:"ultron",  name:"Ultron Sentry",  color:"#c0c0d0", size:14, hp:40,  speed:75,  dmg:12, xp:3, score:25, flies:true },
  { id:"symbiote",name:"Symbiote",       color:"#0a0a0a", size:11, hp:22,  speed:110, dmg:9,  xp:2, score:15 },
  { id:"skrull",  name:"Skrull",         color:"#3a8a3a", size:13, hp:28,  speed:80,  dmg:11, xp:2, score:17 },
  { id:"outrider",name:"Outrider",       color:"#7a2a2a", size:15, hp:50,  speed:105, dmg:14, xp:4, score:30 },
  { id:"sentinel",name:"Sentinel",       color:"#e06a10", size:26, hp:180,speed:45,  dmg:18, xp:10,score:80, shoots:true },
  { id:"darkelf", name:"Dark Elf",       color:"#2a2a5a", size:13, hp:45,  speed:120, dmg:13, xp:4, score:35, teleports:true },
  { id:"boss_abom",name:"Abomination",   color:"#4a8a2a", size:50, hp:1200,speed:40,  dmg:25, xp:60,score:500,boss:true },
  { id:"boss_thanos",name:"Thanos",      color:"#8a4aa0", size:55, hp:2500,speed:50,  dmg:30, xp:120,score:1200,boss:true }
];

// ============ UPGRADES ============
const UPGRADES = [
  // Damage
  {id:"dmg1",name:"Enhanced Strength",desc:"+20% damage",rarity:"common",apply:s=>s.dmgMul*=1.2},
  {id:"dmg2",name:"Critical Hits",desc:"10% chance for 3x damage",rarity:"rare",apply:s=>s.crit+=0.10},
  {id:"dmg3",name:"Armor Piercing",desc:"Ignore enemy defense",rarity:"rare",apply:s=>s.pierce=true},
  // Attack speed
  {id:"as1",name:"Quick Reflexes",desc:"+15% fire rate",rarity:"common",apply:s=>s.fireRateMul*=1.15},
  {id:"as2",name:"Rapid Fire",desc:"Shoot 2 projectiles",rarity:"rare",apply:s=>s.projCount+=1},
  {id:"as3",name:"Berserker",desc:"Faster attack when low HP",rarity:"epic",apply:s=>s.berserker=true},
  // Area / Range
  {id:"aoe1",name:"Wider Impact",desc:"+30% attack area",rarity:"common",apply:s=>s.areaMul*=1.3},
  {id:"rng1",name:"Long Range",desc:"Projectiles travel 50% farther",rarity:"common",apply:s=>s.rangeMul*=1.5},
  {id:"chn1",name:"Chain Lightning",desc:"Attacks jump to nearby enemies",rarity:"legendary",apply:s=>s.chain=true},
  // Survivability
  {id:"hp1",name:"Vibranium Suit",desc:"+20 max HP",rarity:"common",apply:s=>{s.maxHp+=20;s.hp+=20}},
  {id:"reg1",name:"Regeneration",desc:"Heal 1 HP/s",rarity:"rare",apply:s=>s.regen+=1},
  {id:"dg1",name:"Spider-Sense",desc:"10% chance to dodge",rarity:"rare",apply:s=>s.dodge+=0.10},
  {id:"sh1",name:"Shield Protocol",desc:"Invincible every 30s",rarity:"epic",apply:s=>s.shieldCD=30},
  // Movement
  {id:"mv1",name:"Super Soldier Serum",desc:"+15% movement speed",rarity:"common",apply:s=>s.speedMul*=1.15},
  {id:"mv2",name:"Web Swing",desc:"Dash with Space/Double-tap",rarity:"rare",apply:s=>s.dash=true},
  {id:"mv3",name:"Phantom Form",desc:"Move through enemies",rarity:"epic",apply:s=>s.phantom=true},
  // Special
  {id:"sp1",name:"Avengers Assemble",desc:"Summon ally every 60s",rarity:"legendary",apply:s=>s.summonCD=60},
  {id:"sp2",name:"Infinity Stone",desc:"Powerful effect every 60s",rarity:"legendary",apply:s=>s.stoneCD=60},
  {id:"sp3",name:"Gamma Radiation",desc:"Enemies explode on death",rarity:"epic",apply:s=>s.explode=true}
];

// ============ GAME STATE ============
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W=0,H=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener("resize",resize);resize();

let state = { running:false };
let player, enemies, projectiles, enemyProj, orbs, particles, allies, floatTexts;
let keys = {}, joystickVec = {x:0,y:0};
let selectedHero = "spiderman";
let playerName = "Hero";

function fmtTime(s){s=Math.floor(s);const m=Math.floor(s/60);return m+":"+(s%60).toString().padStart(2,"0")}

// ============ SCREEN NAV ============
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.getElementById("hud").classList.toggle("hidden", id!=="game");
}
function goToHeroSelect(){
  if(document.getElementById("nameInput").value.trim()) playerName = document.getElementById("nameInput").value.trim().slice(0,14);
  renderHeroes();
  showScreen("heroScreen");
}
function renderHeroes(){
  const list = document.getElementById("heroList");
  list.innerHTML = "";
  for(const k in HEROES){
    const h = HEROES[k];
    const c = document.createElement("div");
    c.className = "hero-card"+(k===selectedHero?" selected":"");
    c.innerHTML = `<div class="hero-icon" style="background:${h.color};color:${h.accent}">${h.icon}</div>
      <div class="hero-name">${h.name}</div>
      <div class="hero-desc">${h.desc}</div>`;
    c.onclick = ()=>{selectedHero=k;renderHeroes()};
    list.appendChild(c);
  }
}

// ============ START GAME ============
function startGame(){
  const hero = HEROES[selectedHero];
  player = {
    x:W/2, y:H/2, r:16, vx:0, vy:0,
    hp: Math.round(100*hero.hpMul), maxHp: Math.round(100*hero.hpMul),
    speed: 210*hero.speedMul,
    heroKey: selectedHero, hero: hero,
    fireRate: 0.6, fireCD:0,
    dmg: 10, dmgMul: hero.dmgMul,
    crit:0, pierce:false, areaMul:1, rangeMul:1, projCount:1, berserker:false,
    regen:0, dodge: hero.special==="dodge"?0.1:0, shieldCD:0, shieldT:0,
    speedMul:1, dash:false, dashCD:0, dashT:0, phantom:false,
    summonCD:0, stoneCD:0, explode:false, chain:false,
    fireRange: 320, xp:0, lvl:1, xpNeed:10,
    time:0, kills:0, score:0, pendingLevelUp:0,
    auraCD:0, specialCD:20
  };
  enemies=[]; projectiles=[]; enemyProj=[]; orbs=[]; particles=[]; allies=[]; floatTexts=[];
  state.running = true;
  state.lastSpawn = 0;
  state.lastBoss = 0;
  state.startTime = performance.now();
  showScreen("game");
  requestAnimationFrame(loop);
}

// ============ INPUT ============
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true; if(e.key===" "&&player&&player.dash&&player.dashCD<=0){player.dashT=0.15;player.dashCD=3}});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

// Joystick
const joy = document.getElementById("joystick");
const joyKnob = document.getElementById("joystickKnob");
let joyActive=false, joyId=null, joyCenter={x:0,y:0};
joy.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];joyId=t.identifier;joyActive=true;
  const r=joy.getBoundingClientRect();
  joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};
  handleJoyMove(t.clientX,t.clientY);e.preventDefault();
},{passive:false});
joy.addEventListener("touchmove",e=>{
  for(const t of e.changedTouches){if(t.identifier===joyId)handleJoyMove(t.clientX,t.clientY)}
  e.preventDefault();
},{passive:false});
joy.addEventListener("touchend",e=>{
  for(const t of e.changedTouches){if(t.identifier===joyId){joyActive=false;joyId=null;joystickVec.x=0;joystickVec.y=0;joyKnob.style.transform="translate(-50%,-50%)"}}
  e.preventDefault();
},{passive:false});
function handleJoyMove(cx,cy){
  const dx=cx-joyCenter.x, dy=cy-joyCenter.y;
  const d=Math.hypot(dx,dy), max=50;
  const cl=Math.min(d,max);
  const ang=Math.atan2(dy,dx);
  joystickVec.x = Math.cos(ang)*(cl/max);
  joystickVec.y = Math.sin(ang)*(cl/max);
  joyKnob.style.transform = `translate(calc(-50% + ${joystickVec.x*40}px),calc(-50% + ${joystickVec.y*40}px))`;
}

// ============ GAME LOOP ============
let lastT = 0;
function loop(t){
  if(!state.running)return;
  const dt = Math.min(0.05,(t-lastT)/1000 || 0);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  if(!player || player.hp<=0)return;
  player.time += dt;

  // Input
  let ix=0, iy=0;
  if(keys["w"]||keys["arrowup"])iy-=1;
  if(keys["s"]||keys["arrowdown"])iy+=1;
  if(keys["a"]||keys["arrowleft"])ix-=1;
  if(keys["d"]||keys["arrowright"])ix+=1;
  ix += joystickVec.x; iy += joystickVec.y;
  const il = Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il}

  // Movement
  let spd = player.speed*player.speedMul;
  if(player.dashT>0){spd*=3; player.dashT-=dt}
  if(player.dashCD>0)player.dashCD-=dt;
  player.x += ix*spd*dt;
  player.y += iy*spd*dt;
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  // Regen
  if(player.regen>0)player.hp=Math.min(player.maxHp, player.hp + player.regen*dt);
  if(player.shieldCD>0)player.shieldCD-=dt;
  if(player.shieldT>0)player.shieldT-=dt;
  else if(player.shieldCD<=0){player.shieldT=2; player.shieldCD=30}
  if(player.auraCD>0)player.auraCD-=dt;

  // Hero specials
  if(player.hero.special==="aura" && player.auraCD<=0){
    // lightning aura
    enemies.forEach(e=>{
      const d=Math.hypot(e.x-player.x,e.y-player.y);
      if(d<140*player.areaMul){damageEnemy(e, player.dmg*player.dmgMul*0.5, "⚡")}
    });
    player.auraCD = 1.0;
    // visual
    for(let i=0;i<6;i++){
      const a=Math.random()*Math.PI*2;
      particles.push({x:player.x+Math.cos(a)*50,y:player.y+Math.sin(a)*50,vx:Math.cos(a)*100,vy:Math.sin(a)*100,life:0.3,color:"#5182ed",size:3});
    }
  }

  // Spawn enemies
  const spawnRate = 1.0 + player.time*0.08; // enemies per sec, scales up
  state.spawnAccum = (state.spawnAccum||0) + dt*spawnRate * (player.hero.special==="slowspawn"?0.8:1);
  while(state.spawnAccum >= 1){
    state.spawnAccum--;
    spawnEnemy();
  }

  // Boss every 60s
  if(player.time - state.lastBoss > 60){
    state.lastBoss = player.time;
    spawnBoss();
    toast("⚠️ BOSS INCOMING!");
  }

  // Auto-attack
  player.fireCD -= dt;
  if(player.berserker && player.hp/player.maxHp < 0.3){
    if(player.fireCD > 0) player.fireCD -= dt*0.5; // extra tick
  }
  if(player.fireCD <= 0){
    const target = nearestEnemy();
    if(target){
      fireWeapon(target);
      let fr = player.fireRate / player.fireRateMul;
      if(player.berserker && player.hp/player.maxHp<0.3) fr*=0.6;
      player.fireCD = fr;
    }
  }

  // Allies attack
  allies.forEach(a=>{
    a.life-=dt; a.cd-=dt;
    if(a.cd<=0){
      const t=nearestEnemy(a);
      if(t){
        const ang=Math.atan2(t.y-a.y,t.x-a.x);
        projectiles.push({x:a.x,y:a.y,vx:Math.cos(ang)*600,vy:Math.sin(ang)*600,dmg:10*player.dmgMul,r:4,color:"#f7d02e",life:1.5,friendly:true});
      }
      a.cd=0.4;
    }
    a.x+=Math.cos(a.t+player.time)*40*dt;
    a.y+=Math.sin(a.t+player.time)*40*dt;
  });
  allies = allies.filter(a=>a.life>0);

  // Projectiles
  for(const p of projectiles){
    if(p.homing){
      const t=nearestEnemy(p);
      if(t){
        const ang=Math.atan2(t.y-p.y,t.x-p.x);
        const spd2=Math.hypot(p.vx,p.vy);
        p.vx=p.vx*0.85 + Math.cos(ang)*spd2*0.15;
        p.vy=p.vy*0.85 + Math.sin(ang)*spd2*0.15;
      }
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.friendly){
      for(const e of enemies){
        if(Math.hypot(e.x-p.x,e.y-p.y) < e.r+p.r){
          let dmg = p.dmg;
          if(Math.random()<player.crit){dmg*=3; floatText(e.x,e.y,"CRIT!","#f7d02e")}
          damageEnemy(e, dmg);
          if(p.pierce && p.bounces===undefined){/* keep going */} else { p.life=0; }
          if(p.explode){
            for(let i=0;i<12;i++){
              particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:0.4,color:p.color,size:4});
            }
          }
          if(p.chain){
            let chainTargets = enemies.filter(x=>x!==e&&x.hp>0).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y)).slice(0,2);
            chainTargets.forEach((ct,i)=>{
              setTimeout(()=>{if(ct.hp>0)damageEnemy(ct, dmg*0.6, "⚡")}, i*80);
            });
          }
          break;
        }
      }
    } else {
      if(Math.hypot(player.x-p.x,player.y-p.y) < player.r+p.r){
        if(player.shieldT>0 || player.phantom){/*ignore*/}
        else if(Math.random()<player.dodge){floatText(player.x,player.y,"DODGE!","#5182ed");}
        else {damagePlayer(p.dmg);}
        p.life=0;
      }
    }
  }
  projectiles = projectiles.filter(p=>p.life>0 && p.x>-50 && p.x<W+50 && p.y>-50 && p.y<H+50);

  // Enemy projectiles
  enemyProj = enemyProj.filter(p=>p.life>0);
  for(const p of enemyProj){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(Math.hypot(player.x-p.x,player.y-p.y) < player.r+p.r){
      if(player.shieldT>0||player.phantom){}
      else if(Math.random()<player.dodge){floatText(player.x,player.y,"DODGE!","#5182ed")}
      else damagePlayer(p.dmg);
      p.life=0;
    }
  }

  // Enemies update
  for(const e of enemies){
    if(e.hp<=0)continue;
    const ang = Math.atan2(player.y-e.y,player.x-e.x);
    const spd2 = e.speed * (state.slowAll||1);
    e.x += Math.cos(ang)*spd2*dt;
    e.y += Math.sin(ang)*spd2*dt;
    if(e.teleports){
      e.tpCD = (e.tpCD||0) - dt;
      if(e.tpCD<=0){
        e.x = player.x + (Math.random()-.5)*300;
        e.y = player.y + (Math.random()-.5)*300;
        e.tpCD = 2+Math.random()*2;
        for(let i=0;i<6;i++) particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:0.3,color:"#5555ff",size:3});
      }
    }
    if(e.shoots){
      e.sCD = (e.sCD||1.5) - dt;
      if(e.sCD<=0){
        e.sCD = e.boss?1.2:2.0;
        const a2=Math.atan2(player.y-e.y,player.x-e.x);
        const cnt = e.boss?8:1;
        for(let i=0;i<cnt;i++){
          const a3 = cnt>1 ? a2 + (i-(cnt-1)/2)*0.2 : a2;
          enemyProj.push({x:e.x,y:e.y,vx:Math.cos(a3)*250,vy:Math.sin(a3)*250,dmg:e.dmg*0.6,r:4,color:"#ff4444",life:2.5});
        }
      }
    }
    // contact damage
    if(Math.hypot(e.x-player.x,e.y-player.y) < e.r+player.r){
      if(!e.cdt) e.cdt=0;
      if(e.cdt<=0){
        if(player.shieldT<=0 && !player.phantom && Math.random()>=player.dodge){
          damagePlayer(e.dmg*0.5);
        }
        e.cdt = 0.5;
      }
    }
    if(e.cdt>0)e.cdt-=dt;
    if(e.hit>0) e.hit -= dt;
  }
  if(state.slowAll){state.slowAllT -= dt; if(state.slowAllT<=0) state.slowAll=1}

  // Dead enemies drop XP
  enemies = enemies.filter(e=>{
    if(e.hp<=0){
      player.kills++; player.score += e.score;
      for(let i=0;i<e.xp;i++){
        orbs.push({x:e.x+(Math.random()-.5)*20,y:e.y+(Math.random()-.5)*20,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,value:1,life:30});
      }
      if(player.explode){
        for(const e2 of enemies){
          if(e2===e||e2.hp<=0)continue;
          if(Math.hypot(e2.x-e.x,e2.y-e.y)<80){
            damageEnemy(e2, player.dmg*player.dmgMul*0.5, "💥");
          }
        }
        for(let i=0;i<15;i++) particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,life:0.5,color:"#ff8800",size:5});
      }
      for(let i=0;i<6;i++) particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:0.4,color:e.color,size:3});
      return false;
    }
    return true;
  });

  // Orbs magnet
  for(const o of orbs){
    o.life-=dt;
    o.vx *= 0.92; o.vy *= 0.92;
    o.x+=o.vx*dt; o.y+=o.vy*dt;
    const d = Math.hypot(player.x-o.x,player.y-o.y);
    if(d<100){
      const ang=Math.atan2(player.y-o.y,player.x-o.x);
      const pull = (100-d)*4;
      o.vx += Math.cos(ang)*pull*dt*60;
      o.vy += Math.sin(ang)*pull*dt*60;
    }
    if(d<player.r+8){
      player.xp += o.value;
      o.life = 0;
      while(player.xp >= player.xpNeed){
        player.xp -= player.xpNeed;
        player.lvl++;
        player.xpNeed = Math.round(player.xpNeed*1.35)+5;
        player.pendingLevelUp++;
      }
    }
  }
  orbs = orbs.filter(o=>o.life>0);

  // Particles & texts
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=0.95;p.vy*=0.95});
  particles = particles.filter(p=>p.life>0);
  floatTexts.forEach(f=>{f.y-=30*dt;f.life-=dt});
  floatTexts = floatTexts.filter(f=>f.life>0);

  // Summon CD
  if(player.summonCD>0){player.summonT=(player.summonT||0)-dt; if(player.summonT<=0 && player.summonCD){/* already handled on levelup */}}

  // Stone CD
  if(player.stoneCD>0){
    player.stoneT=(player.stoneT||60)-dt;
    if(player.stoneT<=0){
      player.stoneT=60;
      // random effect
      const fx = Math.floor(Math.random()*4);
      if(fx===0){enemies.forEach(e=>damageEnemy(e,player.dmg*player.dmgMul*2,"✦")); toast("INFINITY BURST!");}
      else if(fx===1){state.slowAll=0.3;state.slowAllT=5; toast("TIME STONE!")}
      else if(fx===2){player.hp=player.maxHp; toast("SOUL STONE - FULL HEAL!");}
      else {enemies.forEach(e=>damageEnemy(e,500,"💥")); toast("POWER STONE!");}
    }
  }
  if(player.summonCD>0){
    player.summonT=(player.summonT||60)-dt;
    if(player.summonT<=0){
      player.summonT=60;
      for(let i=0;i<2;i++){
        const ang=Math.random()*Math.PI*2;
        allies.push({x:player.x+Math.cos(ang)*50,y:player.y+Math.sin(ang)*50,life:15,cd:0,t:ang});
      }
      toast("AVENGERS ASSEMBLE!");
    }
  }

  // Update HUD
  document.getElementById("hpText").textContent = Math.ceil(player.hp)+"/"+player.maxHp;
  document.getElementById("hpFill").style.width = Math.max(0,player.hp/player.maxHp*100)+"%";
  document.getElementById("lvlText").textContent = player.lvl;
  document.getElementById("xpFill").style.width = (player.xp/player.xpNeed*100)+"%";
  document.getElementById("timeText").textContent = fmtTime(player.time);
  document.getElementById("killText").textContent = player.kills;
  document.getElementById("heroText").textContent = player.hero.name;

  // Level up popup
  if(player.pendingLevelUp>0){
    player.pendingLevelUp--;
    showUpgradeChoice();
  }
}

function nearestEnemy(from){
  from = from||player;
  let best=null, bd=Infinity;
  for(const e of enemies){
    if(e.hp<=0)continue;
    const d=Math.hypot(e.x-from.x,e.y-from.y);
    if(d<bd && d<player.fireRange*player.rangeMul){bd=d;best=e}
  }
  return best;
}

function spawnEnemy(){
  const time = player.time;
  // pick from pool based on time
  let pool;
  if(time<60) pool = [0,0,1];
  else if(time<180) pool = [0,1,2,3];
  else if(time<360) pool = [1,2,3,4,5];
  else if(time<540) pool = [3,4,5,6,7];
  else pool = [4,5,6,7,8];
  const e = {...ENEMIES[pool[Math.floor(Math.random()*pool.length)]]};
  // spawn off screen
  const side = Math.floor(Math.random()*4);
  if(side===0){e.x=Math.random()*W; e.y=-30}
  else if(side===1){e.x=W+30; e.y=Math.random()*H}
  else if(side===2){e.x=Math.random()*W; e.y=H+30}
  else {e.x=-30; e.y=Math.random()*H}
  // scale HP/dmg with time
  const s = 1 + time*0.006;
  e.hp = Math.round(e.hp*s);
  e.dmg = Math.round(e.dmg*s);
  e.hit = 0;
  enemies.push(e);
}
function spawnBoss(){
  const idx = player.time>300 ? 10 : 9;
  const e = {...ENEMIES[idx]};
  e.x = W/2 + (Math.random()-.5)*200;
  e.y = -60;
  const s = 1 + player.time*0.004;
  e.hp = Math.round(e.hp*s);
  e.dmg = Math.round(e.dmg*s);
  e.hit = 0;
  enemies.push(e);
}

function fireWeapon(target){
  const ang = Math.atan2(target.y-player.y, target.x-player.x);
  const w = player.hero.weapon;
  const baseDmg = player.dmg*player.dmgMul;
  const range = player.fireRange*player.rangeMul;
  const count = player.projCount;

  for(let i=0;i<count;i++){
    const spread = count>1 ? (i-(count-1)/2)*0.18 : 0;
    const a = ang + spread;
    if(w==="web"){
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,dmg:baseDmg,r:5,color:"#f7f7f7",life:range/700,friendly:true,explode:true});
    } else if(w==="repulsor"){
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,dmg:baseDmg,r:6,color:"#f7d02e",life:range/900,friendly:true,pierce:player.pierce});
    } else if(w==="mjolnir"){
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,dmg:baseDmg*1.5,r:10,color:"#5182ed",life:range/500*1.8,friendly:true,boomerang:true,origX:player.x,origY:player.y,t:0});
    } else if(w==="shield"){
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,dmg:baseDmg,r:12,color:"#1f4ea8",life:range/600*1.5,friendly:true,bounces:3});
    } else if(w==="mystic"){
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*400,vy:Math.sin(a)*400,dmg:baseDmg*1.2,r:7,color:"#a020f0",life:range/400*1.5,friendly:true,homing:true});
    } else if(w==="chaos"){
      // AoE blast
      for(let k=0;k<8;k++){
        const a2 = k*Math.PI/4;
        projectiles.push({x:player.x,y:player.y,vx:Math.cos(a2)*400,vy:Math.sin(a2)*400,dmg:baseDmg*0.8,r:8,color:"#e52529",life:0.5,friendly:true,explode:true});
      }
      break; // only one burst
    }
  }

  // Boomerang logic (handled in projectile update if we had one, simple approximation):
  // We'll let mjolnir come back by reversing velocity after half its life (handled in update loop? we didn't add, let's add)
}

// Special effects on hit
function damageEnemy(e, dmg, label){
  if(e.hp<=0)return;
  e.hp -= dmg;
  e.hit = 0.1;
  floatText(e.x, e.y, Math.round(dmg).toString(), label?"#f7d02e":"#fff");
  if(label) floatText(e.x, e.y-20, label, "#f7d02e");
}
function damagePlayer(dmg){
  if(player.shieldT>0||player.phantom)return;
  player.hp -= dmg;
  floatText(player.x, player.y, "-"+Math.round(dmg), "#ff4444");
  if(player.hp<=0){
    gameOver();
  }
}
function floatText(x,y,txt,color){
  floatTexts.push({x,y,txt,color,life:0.8});
}
function toast(msg){
  const t = document.createElement("div");
  t.className="toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1200);
}

// ============ UPGRADES ============
function showUpgradeChoice(){
  // pick 3 random upgrades, weighting by rarity
  const weights = {common:60, rare:30, epic:10, legendary:3};
  const pool = [];
  UPGRADES.forEach(u=>{for(let i=0;i<weights[u.rarity];i++)pool.push(u)});
  const picks = [];
  while(picks.length<3 && pool.length>0){
    const u = pool[Math.floor(Math.random()*pool.length)];
    if(!picks.includes(u))picks.push(u);
  }
  const list = document.getElementById("upgradeList");
  list.innerHTML="";
  picks.forEach(u=>{
    const el = document.createElement("div");
    el.className="upgrade-option";
    el.innerHTML = `<span class="upgrade-rarity rarity-${u.rarity}">${u.rarity.toUpperCase()}</span>
      <div class="upgrade-name">${u.name}</div>
      <div class="upgrade-desc">${u.desc}</div>`;
    el.onclick = ()=>{
      u.apply(player);
      document.getElementById("upgradeScreen").classList.add("hidden");
    };
    list.appendChild(el);
  });
  document.getElementById("upgradeScreen").classList.remove("hidden");
}

// ============ GAME OVER ============
async function gameOver(){
  state.running = false;
  const score = Math.round(player.score + player.time*2 + player.kills);
  document.getElementById("finalTime").textContent = fmtTime(player.time);
  document.getElementById("finalKills").textContent = player.kills;
  document.getElementById("finalLevel").textContent = player.lvl;
  document.getElementById("finalScore").textContent = score;
  showScreen("gameOverScreen");

  if(sb){
    try{
      await sb.from("leaderboard").insert({
        player_name: playerName,
        hero: player.hero.name,
        score: score,
        time_survived: Math.floor(player.time),
        level_reached: player.lvl
      });
    }catch(e){console.warn("LB save failed:",e)}
  }
}

// ============ LEADERBOARD ============
async function showLeaderboard(){
  showScreen("leaderboardScreen");
  const list = document.getElementById("lbList");
  list.innerHTML = `<div class="lb-row head"><div>#</div><div>Hero</div><div>Score</div><div>Time</div></div>`;
  if(!sb){
    list.innerHTML += `<div class="lb-row" style="grid-column:1/-1;text-align:center;color:#888">Supabase not connected</div>`;
    return;
  }
  try{
    const {data} = await sb.from("leaderboard").select("*").order("score",{ascending:false}).limit(25);
    if(!data || data.length===0){
      list.innerHTML += `<div class="lb-row" style="grid-column:1/-1;text-align:center;color:#888">No scores yet. Be the first!</div>`;
      return;
    }
    data.forEach((r,i)=>{
      const row = document.createElement("div");
      row.className="lb-row";
      row.innerHTML = `<div>${i+1}</div><div>${escapeHtml(r.player_name)} (${r.hero})</div><div>${r.score}</div><div>${fmtTime(r.time_survived)}</div>`;
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML += `<div class="lb-row" style="grid-column:1/-1;text-align:center;color:#ff8888">Error loading: ${e.message}</div>`;
  }
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

// ============ RENDER ============
function render(){
  // background grid
  ctx.fillStyle = "#0f0f1e";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#1a1a2e";
  ctx.lineWidth = 1;
  const gridSize = 60;
  const camX = player ? player.x - W/2 : 0;
  const camY = player ? player.y - H/2 : 0;
  for(let x=-camX%gridSize;x<W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=-camY%gridSize;y<H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  if(!player)return;

  // Orbs
  for(const o of orbs){
    ctx.fillStyle = "#7aaeff";
    ctx.shadowColor="#5182ed"; ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(o.x,o.y,5+Math.sin(o.life*6)*1,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Allies
  for(const a of allies){
    ctx.fillStyle = "#f7d02e";
    ctx.beginPath();ctx.arc(a.x,a.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#000"; ctx.font="bold 12px Arial"; ctx.textAlign="center";
    ctx.fillText("★",a.x,a.y+4);
  }

  // Enemies
  for(const e of enemies){
    if(e.hp<=0)continue;
    ctx.fillStyle = e.hit>0 ? "#ffffff" : e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.stroke();
    if(e.boss){
      ctx.strokeStyle="#f7d02e"; ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,Math.PI*2);ctx.stroke();
    }
    // HP bar
    if(e.hp < e.maxHp*1.2){
      const bw = e.r*2, bh=4;
      ctx.fillStyle="#330000"; ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw,bh);
      ctx.fillStyle="#e52529";
      const maxHp = ENEMIES.find(en=>en.id===e.id).hp*(1+player.time*0.006);
      ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw*Math.max(0,e.hp/maxHp),bh);
    }
  }

  // Enemy projectiles
  for(const p of enemyProj){
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }

  // Projectiles
  for(const p of projectiles){
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(p.boomerang){
      // boomerang return logic
      p.t = (p.t||0)+0.05;
      if(p.t>1.5){
        const ang = Math.atan2(player.y-p.y, player.x-p.x);
        p.vx = Math.cos(ang)*600;
        p.vy = Math.sin(ang)*600;
      }
    }
    if(p.bounces!==undefined){
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      if(Math.random()<0.15){p.bounces--; if(p.bounces<0)p.life=0}
    }
  }

  // Player
  ctx.fillStyle = player.shieldT>0 ? "#7af7ff" : player.hero.color;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle = player.hero.accent; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px Arial"; ctx.textAlign="center";
  ctx.fillText(player.hero.icon, player.x, player.y+6);

  // Particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life/0.5);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Float texts
  ctx.textAlign="center";
  for(const f of floatTexts){
    ctx.globalAlpha = Math.max(0,f.life/0.8);
    ctx.fillStyle=f.color;
    ctx.font="bold 16px Arial";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha=1;
}

// Init
showScreen("menuScreen");
</script>
</body>
