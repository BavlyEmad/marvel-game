<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport & Prevent Zooming -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marvel Survivors V1</title>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; touch-action: none; }
        canvas { display: block; margin: 0 auto; background: #222; }
        
        /* Level Up UI Overlay */
        #levelUpUI {
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif; z-index: 10;
        }
        #levelUpUI h1 { color: #f1c40f; text-shadow: 2px 2px #e74c3c; margin-bottom: 20px; font-size: 2.5em; text-align: center;}
        .upgrade-btn {
            background: #34495e; border: 3px solid #f1c40f; color: white;
            padding: 20px; margin: 10px; width: 80%; max-width: 400px;
            font-size: 1.2em; cursor: pointer; border-radius: 10px;
            transition: 0.2s; text-align: center;
        }
        .upgrade-btn:hover { background: #f1c40f; color: black; transform: scale(1.05); }
    </style>
</head>
<body>

<!-- Level Up Menu -->
<div id="levelUpUI">
    <h1>LEVEL UP!</h1>
    <button class="upgrade-btn" onclick="chooseUpgrade(0)"> Repulsor Upgrade (Faster Fire Rate)</button>
    <button class="upgrade-btn" onclick="chooseUpgrade(1)">🛡️ Vibranium Suit (+20 Max Health)</button>
    <button class="upgrade-btn" onclick="chooseUpgrade(2)">🏃 Super Soldier Serum (+15% Move Speed)</button>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Phaser 3 Engine -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<script>
    // ==========================================
    // 1. SUPABASE DATABASE SETUP
    // ==========================================
    const SUPABASE_URL = 'https://lnztwceiuzqxazatdten.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_XX4svimjCN05aZ64giuy0g_R4ES5GUU';
    
    let supabase;
    let playerGold = 0;
    let deviceId = localStorage.getItem('marvel_device_id') || 'guest_' + Math.random().toString(36).substring(7);
    localStorage.setItem('marvel_device_id', deviceId);

    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log("Supabase connected successfully!");
    } catch(e) { console.log("Supabase connection error."); }

    // ==========================================
    // 2. GAME VARIABLES & STATE
    // ==========================================
    let player, enemies, bullets, xpOrbs;
    let wasd;
    let joystickBase, joystickKnob;
    let isTouching = false;
    let fireRate = 500; 
    let lastFired = 0;
    let playerSpeed = 200;
    let playerHealth = 100;
    let maxHealth = 100;
    let xp = 0;
    let xpToNextLevel = 10;
    let level = 1;

    // ==========================================
    // 3. PHASER GAME SCENES
    // ==========================================
    class GameScene extends Phaser.Scene {
        constructor() { super('GameScene'); }

        preload() {
            // Generating shapes with code so you don't need image files!
            let g = this.make.graphics();
            
            // Iron Man (Player) - Red square with Gold core
            g.fillStyle(0xe74c3c); g.fillRect(0, 0, 40, 40); 
            g.fillStyle(0xf1c40f); g.fillRect(10, 10, 20, 20); 
            g.generateTexture('player', 40, 40); g.clear();

            // Hydra Enemy - Green circle with black mask
            g.fillStyle(0x2ecc71); g.fillCircle(20, 20, 20); 
            g.fillStyle(0x000000); g.fillRect(10, 15, 20, 5); 
            g.generateTexture('enemy', 40, 40); g.clear();

            // Repulsor Bullet - Cyan circle
            g.fillStyle(0x00ffff); g.fillCircle(8, 8, 8);
            g.generateTexture('bullet', 16, 16); g.clear();

            // XP Orb - Blue triangle
            g.fillStyle(0x3498db); g.fillTriangle(10, 0, 20, 20, 0, 20);
            g.generateTexture('xp', 20, 20); g.clear();
        }

        create() {
            enemies = this.physics.add.group();
            bullets = this.physics.add.group();
            xpOrbs = this.physics.add.group();

            player = this.physics.add.sprite(400, 300, 'player');
            player.setCollideWorldBounds(true);
            this.cameras.main.startFollow(player);

            this.physics.world.setBounds(-2000, -2000, 4000, 4000);

            // PC Keyboard Controls
            wasd = this.input.keyboard.addKeys('W,A,S,D');

            // Mobile Virtual Joystick
            this.createJoystick();

            // Spawn enemies every 1 second
            this.time.addEvent({
                delay: 1000,
                callback: this.spawnEnemy,
                callbackScope: this,
                loop: true
            });

            // Collisions
            this.physics.add.overlap(bullets, enemies, this.hitEnemy, null, this);
            this.physics.add.overlap(player, enemies, this.playerHit, null, this);
            this.physics.add.overlap(player, xpOrbs, this.collectXP, null, this);
        }

        update(time, delta) {
            if (this.isPaused) return; 

            let vx = 0; let vy = 0;

            // PC Input
            if (wasd.A.isDown) vx = -1;
            else if (wasd.D.isDown) vx = 1;
            if (wasd.W.isDown) vy = -1;
            else if (wasd.S.isDown) vy = 1;

            // Mobile Joystick Input
            if (isTouching) {
                let dist = Phaser.Math.Distance.Between(joystickBase.x, joystickBase.y, joystickKnob.x, joystickKnob.y);
                if (dist > 10) {
                    vx = (joystickKnob.x - joystickBase.x) / 50; 
                    vy = (joystickKnob.y - joystickBase.y) / 50;
                }
            }

            player.setVelocity(vx * playerSpeed, vy * playerSpeed);

            // Auto Attack
            if (time > lastFired + fireRate) {
                this.shootBullet();
                lastFired = time;
            }
        }

        createJoystick() {
            let g = this.make.graphics();
            g.fillStyle(0xffffff, 0.3); g.fillCircle(50, 50, 50);
            g.generateTexture('joyBase', 100, 100); g.clear();
            
            g.fillStyle(0xffffff, 0.6); g.fillCircle(25, 25, 25);
            g.generateTexture('joyKnob', 50, 50); g.clear();

            joystickBase = this.add.sprite(100, 500, 'joyBase').setScrollFactor(0).setDepth(10).setVisible(false);
            joystickKnob = this.add.sprite(100, 500, 'joyKnob').setScrollFactor(0).setDepth(11).setVisible(false);

            this.input.on('pointerdown', (pointer) => {
                if (pointer.x < this.scale.width / 2) { 
                    isTouching = true;
                    joystickBase.setVisible(true).setPosition(pointer.x, pointer.y);
                    joystickKnob.setVisible(true).setPosition(pointer.x, pointer.y);
                }
            });

            this.input.on('pointermove', (pointer) => {
                if (isTouching) {
                    let dist = Phaser.Math.Distance.Between(joystickBase.x, joystickBase.y, pointer.x, pointer.y);
                    let angle = Phaser.Math.Angle.Between(joystickBase.x, joystickBase.y, pointer.x, pointer.y);
                    let limit = Math.min(dist, 50);
                    joystickKnob.x = joystickBase.x + Math.cos(angle) * limit;
                    joystickKnob.y = joystickBase.y + Math.sin(angle) * limit;
                }
            });

            this.input.on('pointerup', () => {
                isTouching = false;
                joystickBase.setVisible(false);
                joystickKnob.setVisible(false);
            });
        }

        spawnEnemy() {
            let angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
            let dist = 500;
            let x = player.x + Math.cos(angle) * dist;
            let y = player.y + Math.sin(angle) * dist;

            let enemy = enemies.create(x, y, 'enemy');
            this.physics.moveToObject(enemy, player, 100);
            
            // Keep chasing player
            this.time.addEvent({
                delay: 1000, 
                callback: () => { if(enemy.active) this.physics.moveToObject(enemy, player, 100); },
                loop: true
            });
        }

        shootBullet() {
            let nearest = null;
            let minDist = Infinity;
            enemies.children.iterate((enemy) => {
                if(!enemy) return;
                let d = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
                if(d < minDist) { minDist = d; nearest = enemy; }
            });

            if (nearest && minDist < 600) {
                let bullet = bullets.create(player.x, player.y, 'bullet');
                this.physics.moveToObject(bullet, nearest, 500);
                this.time.delayedCall(2000, () => { if(bullet.active) bullet.destroy(); });
            }
        }

        hitEnemy(bullet, enemy) {
            bullet.destroy();
            enemy.destroy();
            let xpOrb = xpOrbs.create(enemy.x, enemy.y, 'xp');
        }

        playerHit(playerSprite, enemy) {
            playerHealth -= 10;
            enemy.destroy();
            playerSprite.setTint(0xff0000);
            this.time.delayedCall(100, () => playerSprite.clearTint());

            if(playerHealth <= 0) {
                this.scene.restart(); 
            }
        }

        collectXP(playerSprite, xpOrb) {
            xpOrb.destroy();
            xp += 1;
            if (xp >= xpToNextLevel) {
                this.levelUp();
            }
        }

        levelUp() {
            xp = 0;
            xpToNextLevel = Math.floor(xpToNextLevel * 1.5);
            level++;
            
            this.isPaused = true;
            this.physics.pause();
            document.getElementById('levelUpUI').style.display = 'flex';
        }
    }

    // ==========================================
    // 4. LEVEL UP LOGIC
    // ==========================================
    window.chooseUpgrade = function(choice) {
        if (choice === 0) fireRate = Math.max(100, fireRate - 100); 
        if (choice === 1) { maxHealth += 20; playerHealth += 20; } 
        if (choice === 2) playerSpeed += 40; 

        document.getElementById('levelUpUI').style.display = 'none';
        
        let scene = game.scene.getScene('GameScene');
        scene.isPaused = false;
        scene.physics.resume();
    };

    // ==========================================
    // 5. START THE GAME
    // ==========================================
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: [GameScene],
        scale: {
            mode: Phaser.Scale.RESIZE,
            autoCenter: Phaser.Scale.CENTER_BOTH
        }
    };

    const game = new Phaser.Game(config);
</script>
</body>
</html>
